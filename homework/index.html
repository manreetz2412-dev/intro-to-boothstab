<!DOCTYPE html>
<html>
<head>
    <title>Different Bootstrap Pagination</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="p-5">

    <div class="container">

        <h2 class="mb-4">1. Basic Pagination</h2>
        <nav>
            <ul class="pagination">
                <li class="page-item"><a class="page-link" href="#">Previous</a></li>
                <li class="page-item"><a class="page-link" href="#">1</a></li>
                <li class="page-item active"><a class="page-link" href="#">2</a></li>
                <li class="page-item"><a class="page-link" href="#">3</a></li>
                <li class="page-item"><a class="page-link" href="#">Next</a></li>
            </ul>
        </nav>


        <h2 class="mt-5 mb-4">2. Centered Pagination</h2>
        <nav>
            <ul class="pagination justify-content-center">
                <li class="page-item disabled"><a class="page-link" href="#">Previous</a></li>
                <li class="page-item active"><a class="page-link" href="#">1</a></li>
                <li class="page-item"><a class="page-link" href="#">2</a></li>
                <li class="page-item"><a class="page-link" href="#">3</a></li>
                <li class="page-item"><a class="page-link" href="#">Next</a></li>
            </ul>
        </nav>


        <h2 class="mt-5 mb-4">3. Large Pagination</h2>
        <nav>
            <ul class="pagination pagination-lg">
                <li class="page-item"><a class="page-link" href="#">Previous</a></li>
                <li class="page-item"><a class="page-link" href="#">1</a></li>
                <li class="page-item active"><a class="page-link" href="#">2</a></li>
                <li class="page-item"><a class="page-link" href="#">3</a></li>
                <li class="page-item"><a class="page-link" href="#">Next</a></li>
            </ul>
        </nav>


        <h2 class="mt-5 mb-4">4. Small Pagination with Colors</h2>
        <nav>
            <ul class="pagination pagination-sm">
                <li class="page-item"><a class="page-link text-primary" href="#">Previous</a></li>
                <li class="page-item"><a class="page-link text-success" href="#">1</a></li>
                <li class="page-item active"><a class="page-link bg-dark border-dark" href="#">2</a></li>
                <li class="page-item"><a class="page-link text-danger" href="#">3</a></li>
                <li class="page-item"><a class="page-link text-primary" href="#">Next</a></li>
            </ul>
        </nav>

    </div>

</body>
</html>
